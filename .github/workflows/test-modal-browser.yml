name: Browser Test View Details Stability

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "public/index.html"
      - "public/modal-stability.js"
      - "public/missing-financial-enrichment.js"
      - "public/amount-fix.js"
      - ".github/workflows/test-modal-browser.yml"

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: JavaScript syntax check
        run: |
          node --check public/modal-stability.js
          node --check public/missing-financial-enrichment.js
          grep -q "MAX_CONCURRENT = 6" public/missing-financial-enrichment.js
          grep -q "modal-stability.js" public/index.html
          ! grep -q "public-web-enrichment.js" public/index.html
          ! grep -q "tenderkart-stability.js" public/index.html
          ! grep -q "bid-intelligence.js" public/index.html

      - name: Install browser driver
        run: npm install --no-save --no-audit --no-fund puppeteer-core

      - name: Allow Cloudflare Git deployment to finish
        run: sleep 35

      - name: Test stable View Details and source buttons
        run: |
          node - <<'NODE'
          const puppeteer = require('puppeteer-core');
          const fs = require('fs');
          const chrome = ['/usr/bin/google-chrome','/usr/bin/google-chrome-stable','/usr/bin/chromium','/usr/bin/chromium-browser'].find(fs.existsSync);
          if (!chrome) throw new Error('No Chrome/Chromium executable found on runner');

          const sleep = ms => new Promise(r => setTimeout(r, ms));
          async function responsive(page, label){
            const result = await Promise.race([
              page.evaluate(() => new Promise(resolve => setTimeout(() => resolve('ok'), 120))),
              new Promise((_, reject) => setTimeout(() => reject(new Error(label+' renderer timeout')), 5000))
            ]);
            if(result !== 'ok') throw new Error(label+' unexpected result');
          }

          (async () => {
            const browser = await puppeteer.launch({executablePath:chrome,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            const page = await browser.newPage();
            page.setDefaultTimeout(20000);
            page.on('pageerror', err => console.log('PAGEERROR:', err.message));

            const url='https://karnataka-tender-intelligence.acute-gorilla.workers.dev/';
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000});
            await page.waitForSelector('#tableBody [data-detail]',{timeout:30000});
            await sleep(1800);

            const html = await page.content();
            if(!html.includes('modal-stability.js')) throw new Error('Stable modal controller not deployed');
            if(html.includes('public-web-enrichment.js') || html.includes('tenderkart-stability.js') || html.includes('bid-intelligence.js')) throw new Error('Old modal scripts are still deployed');

            const ref='KNNL/2025-26/IW/WORK_INDENT4114/CALL-2';
            await page.evaluate(ref => {
              const input=document.getElementById('searchInput');
              input.value=ref;
              input.dispatchEvent(new Event('input',{bubbles:true}));
            },ref);
            await sleep(800);
            await page.click('#tableBody [data-detail]');
            await page.waitForSelector('#detailModal.open');
            await responsive(page,'modal open');

            await page.waitForSelector('#tenderKartPrimaryHost .tk-primary-section',{timeout:12000});
            const readiness=await page.$('.stable-readiness');
            if(!readiness) throw new Error('Stable readiness section missing');
            await responsive(page,'after TenderKart load');

            // Click TendersPlus. A verified match is optional; the important test is
            // that the existing KPPP/readiness/TenderKart sections remain in place.
            await page.click('[data-stable-source="tendersplus"]');
            await sleep(1800);
            if(!(await page.$('.stable-readiness'))) throw new Error('Readiness section disappeared after TendersPlus click');
            if(!(await page.$('#tenderKartPrimaryHost .tk-primary-section'))) throw new Error('TenderKart section disappeared after TendersPlus click');
            await responsive(page,'after TendersPlus click');

            for(let i=0;i<2;i++){
              await page.click('#modalClose');
              await page.waitForFunction(()=>!document.getElementById('detailModal')?.classList.contains('open'));
              await responsive(page,'modal close');
              await page.click('#tableBody [data-detail]');
              await page.waitForSelector('#detailModal.open');
              await responsive(page,'modal reopen');
            }
            await page.click('#modalClose');
            await responsive(page,'final close');

            await page.evaluate(()=>{
              const input=document.getElementById('searchInput');
              input.value=''; input.dispatchEvent(new Event('input',{bubbles:true}));
            });
            await sleep(500);
            console.log('Result count:',await page.$eval('#resultCount',el=>el.textContent||''));
            console.log('Stable modal and source-button browser test passed.');
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1);});
          NODE
