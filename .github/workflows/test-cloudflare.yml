name: Validate Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "wrangler.jsonc"
      - "package.json"
      - "package-lock.json"
      - "public/.assetsignore"
      - "public/index.html"
      - "public/missing-financial-enrichment.js"
      - "public/emd-enrichment.css"
      - "public/bid-cost-planner.js"
      - "public/bid-cost-planner.css"
      - "public/filter-quality.js"
      - "public/filter-quality.css"
      - "public/tender-list-experience.js"
      - "public/tender-list-experience.css"
      - ".github/workflows/test-cloudflare.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm install --no-audit --no-fund

      - name: JavaScript Syntax Check
        run: |
          node --check worker/index.js
          node --check public/missing-financial-enrichment.js
          node --check public/bid-cost-planner.js
          node --check public/filter-quality.js
          node --check public/tender-list-experience.js

      - name: Filter Normalization Regression Test
        run: |
          node - <<'NODE'
          require('./public/filter-quality.js');
          const q = globalThis.KPPPFilterQualityUtils;
          if (!q) throw new Error('Filter quality utilities were not exposed');
          const tests = [
            ['RDPR Division Office Bagalakote', 'Bagalkot'],
            ['BAGALKOTE TALUKA', 'Bagalkot'],
            ['Bagalkot District', 'Bagalkot'],
            ['Belgaum Division', 'Belagavi'],
            ['Bijapur Taluk', 'Vijayapura'],
            ['Gulbarga District', 'Kalaburagi']
          ];
          for (const [input, expected] of tests) {
            const actual = q.canonicalDistrictFromText(input);
            if (actual !== expected) throw new Error(`${input}: expected ${expected}, got ${actual}`);
          }
          const rdpr = q.canonicalDepartmentName('RDPR');
          if (rdpr !== 'Rural Development and Panchayat Raj Department') throw new Error(`RDPR normalization failed: ${rdpr}`);
          console.log('Filter normalization tests passed.');
          NODE

      - name: UI Regression Assertions
        run: |
          grep -q "MAX_CONCURRENT = 6" public/missing-financial-enrichment.js
          grep -q "detailCompareToggle" public/tender-list-experience.js
          grep -q "stabilizePlanner" public/tender-list-experience.js
          ! grep -q "openTenderKey" public/tender-list-experience.js
          ! grep -q "clickable-tender-row" public/tender-list-experience.js
          ! grep -q "list-action-hidden" public/tender-list-experience.css
          grep -q "row-compare-btn" public/tender-list-experience.css
          grep -q "bid-check-btn" public/tender-list-experience.css
          grep -q "View Details" public/index.html

      - name: Wrangler Dry Run
        run: npx wrangler deploy --dry-run --outdir cloudflare-dist
