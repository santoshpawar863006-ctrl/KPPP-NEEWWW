name: Smoke Test Cloudflare Live

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-cloudflare-live.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Allow Cloudflare Git build to finish
        run: sleep 35

      - name: Test Home Page
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/ -o /tmp/home.html
          grep -q "Karnataka Tender Intelligence" /tmp/home.html
          grep -q "bid-cost-planner.js" /tmp/home.html
          grep -q "filter-quality.js" /tmp/home.html
          grep -q "tender-list-experience.js" /tmp/home.html
          grep -q "Use View Details to open the tender" /tmp/home.html

      - name: Verify Fast EMD Recovery Deployment
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/missing-financial-enrichment.js -o /tmp/missing-financial.js
          grep -q "MAX_CONCURRENT = 6" /tmp/missing-financial.js
          grep -q "updateTenderState" /tmp/missing-financial.js
          grep -q "pendingRefs" /tmp/missing-financial.js

      - name: Verify Safe Tender Interaction And Stable Planner
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/tender-list-experience.js -o /tmp/list-experience.js
          grep -q "detailCompareToggle" /tmp/list-experience.js
          grep -q "stabilizePlanner" /tmp/list-experience.js
          ! grep -q "openTenderKey" /tmp/list-experience.js
          ! grep -q "clickable-tender-row" /tmp/list-experience.js
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/tender-list-experience.css -o /tmp/list-experience.css
          ! grep -q "list-action-hidden" /tmp/list-experience.css
          grep -q "row-compare-btn" /tmp/list-experience.css
          grep -q "bid-check-btn" /tmp/list-experience.css
          echo "Row click rollback is live; View Details remains the list action."

      - name: Verify Filter Quality Deployment
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/filter-quality.js -o /tmp/filter-quality.js
          grep -q "bagalakote" /tmp/filter-quality.js
          grep -q "advancedFilterDropdown" /tmp/filter-quality.js
          grep -q "main-tender-class-field" /tmp/filter-quality.js
          grep -q "Rural Development and Panchayat Raj Department" /tmp/filter-quality.js

      - name: Verify Bid Planner Without AI
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/bid-cost-planner.js -o /tmp/planner.js
          grep -q "Bid Price & Site Cost Planner" /tmp/planner.js
          grep -q "Estimated site cost" /tmp/planner.js
          ! grep -q "Ask AI" /tmp/planner.js
          ! grep -q "bid_ai" /tmp/planner.js
          ! grep -q "Workers AI" /tmp/planner.js

      - name: Test Live Tender Database And RDPR Sample
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/tenders.json -o /tmp/tenders.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/tenders.json',encoding='utf-8'))
          assert int(data.get('count') or 0) > 1000, data.get('count')
          ref='RDPR/2026-27/RD/WORK_INDENT27965'
          matches=[t for t in data.get('tenders',[]) if t.get('ref_no')==ref]
          assert matches, f'{ref} missing from live database'
          t=matches[0]
          assert 'Rural Development and Panchayat Raj' in str(t.get('department') or ''), t
          print('Tender count:', data.get('count'))
          print('RDPR sample:', t.get('ref_no'), t.get('department'), t.get('location'))
          PY

      - name: Test Health Snapshot
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/health.json -o /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert int(data.get('count') or 0) > 1000
          print('Health snapshot:', data.get('status'), data.get('count'))
          PY

      - name: Test Live System Health
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/api/system_health -o /tmp/system-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/system-health.json',encoding='utf-8'))
          assert data.get('success') is True, data
          assert int((data.get('database') or {}).get('count') or 0) > 1000, data
          print('Overall:', data.get('overall'))
          PY

      - name: Test TenderKart Enrichment
        run: |
          curl -fsSL --get \
            --data-urlencode 'tender=KNNL/2025-26/IW/WORK_INDENT4114/CALL-2' \
            --data-urlencode 'source=tenderkart' \
            https://karnataka-tender-intelligence.acute-gorilla.workers.dev/api/public_tender_detail \
            -o /tmp/tk.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/tk.json',encoding='utf-8'))
          assert data.get('success') is True, data
          sources=data.get('sources') or []
          assert any(str(x.get('source','')).lower()=='tenderkart' for x in sources), data
          print('TenderKart enrichment verified:', len(sources))
          PY
