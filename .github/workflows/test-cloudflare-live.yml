name: Smoke Test Cloudflare Live

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/test-cloudflare-live.yml"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Allow Cloudflare Git build to finish
        run: sleep 25

      - name: Test Home Page
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/ -o /tmp/home.html
          grep -q "Karnataka Tender Intelligence" /tmp/home.html
          grep -q "bid-cost-planner.js" /tmp/home.html

      - name: Verify Bid Planner Without AI
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/bid-cost-planner.js -o /tmp/planner.js
          grep -q "Bid Price & Site Cost Planner" /tmp/planner.js
          grep -q "Estimated site cost" /tmp/planner.js
          ! grep -q "Ask AI" /tmp/planner.js
          ! grep -q "bid_ai" /tmp/planner.js
          ! grep -q "Workers AI" /tmp/planner.js
          echo "Bid planner is live with no AI feature."

      - name: Verify Missing Financial Enrichment
        run: |
          grep -q "missing-financial-enrichment.js" /tmp/home.html
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/missing-financial-enrichment.js -o /tmp/missing-financial.js
          grep -q "TenderKart verified" /tmp/missing-financial.js

      - name: Test Live Tender Database
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/tenders.json -o /tmp/tenders.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/tenders.json',encoding='utf-8'))
          assert int(data.get('count') or 0) > 1000, data.get('count')
          print('Tender count:', data.get('count'))
          print('Categories:', data.get('category_counts'))
          PY

      - name: Test Health Snapshot
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/health.json -o /tmp/health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/health.json',encoding='utf-8'))
          assert int(data.get('count') or 0) > 1000
          print('Health snapshot:', data.get('status'), data.get('count'))
          PY

      - name: Test Live System Health
        run: |
          curl -fsSL https://karnataka-tender-intelligence.acute-gorilla.workers.dev/api/system_health -o /tmp/system-health.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/system-health.json',encoding='utf-8'))
          assert data.get('success') is True, data
          assert int((data.get('database') or {}).get('count') or 0) > 1000, data
          print('Overall:', data.get('overall'))
          print('KPPP:', data.get('kppp'))
          print('TenderKart:', data.get('tenderkart'))
          PY

      - name: Test TenderKart Enrichment
        run: |
          curl -fsSL --get \
            --data-urlencode 'tender=KNNL/2025-26/IW/WORK_INDENT4114/CALL-2' \
            --data-urlencode 'source=tenderkart' \
            https://karnataka-tender-intelligence.acute-gorilla.workers.dev/api/public_tender_detail \
            -o /tmp/tk.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/tk.json',encoding='utf-8'))
          assert data.get('success') is True, data
          sources=data.get('sources') or []
          assert any(str(x.get('source','')).lower()=='tenderkart' for x in sources), data
          print('TenderKart enrichment verified:', len(sources))
          PY
